spring.application.name=civic-connect
server.port=8080
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/civic_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${APP_JWT_SECRET:dev_default_secret_key_needs_to_be_at_least_256_bits_long_for_security}
app.jwt.expiration-minutes=120
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.seed-demo-users=false
